name: Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/**"

permissions:
  contents: write

jobs:
  release:
    # The version-bump commit this job pushes touches custom_components/**
    # and would retrigger the workflow; the second run races past the
    # daily-release guard below (it queries the latest release before the
    # first run has published), producing a duplicate release. Skip runs
    # triggered by the bump commit outright.
    if: "!startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing release today
        id: daily_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq .published_at 2>/dev/null || echo "")
          if [[ "$latest" == "$today"* ]]; then
            echo "Already released today ($latest), skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.daily_check.outputs.skip != 'true'
        with:
          fetch-depth: 0
          # Deploy key bypasses the main-required-checks ruleset so the
          # version-bump commit can be pushed directly to main.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Get current version
        if: steps.daily_check.outputs.skip != 'true'
        id: current
        run: |
          version=$(jq -r .version custom_components/upgrade_advisor/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        if: steps.daily_check.outputs.skip != 'true'
        id: check
        run: |
          if gh release view "v${{ steps.current.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        if: steps.daily_check.outputs.skip != 'true'
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          new_version="${major}.${minor}.$((patch + 1))"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        if: steps.daily_check.outputs.skip != 'true'
        id: version
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "version=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.current.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update manifest version
        if: steps.daily_check.outputs.skip != 'true' && steps.version.outputs.version != steps.current.outputs.version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            custom_components/upgrade_advisor/manifest.json > tmp.json
          mv tmp.json custom_components/upgrade_advisor/manifest.json

      - name: Commit version bump
        if: steps.daily_check.outputs.skip != 'true' && steps.version.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/upgrade_advisor/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create release zip
        if: steps.daily_check.outputs.skip != 'true'
        run: |
          cd custom_components/upgrade_advisor
          zip -r ../../upgrade-advisor.zip .

      - name: Create GitHub Release
        if: steps.daily_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: upgrade-advisor.zip
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
